<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Happy Girlfriend Day Bee!</title>
  <link rel="icon" href="https://img.icons8.com/?size=100&id=581&format=png&color=000000" />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
  <style>
    /* Reset and Base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, #ffe6f0, #c1f0f6);
      overflow: hidden;
      opacity: 0;
      transition: opacity 2s ease-in;
    }

    body.loaded {
      opacity: 1;
    }

    .top-banner {
      position: fixed;
      top: 0;
      width: 100%;
      background: #ff9aa2;
      color: white;
      text-align: center;
      padding: 0.8rem;
      font-weight: bold;
      font-size: 1rem;
      z-index: 1000;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      font-family: 'Pacifico', cursive;
    }

    .flowers {
      position: relative;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    .love-message {
      position: absolute;
      top: 60px;
      width: 100%;
      text-align: center;
      color: #e91e63;
      font-family: 'Pacifico', cursive;
      z-index: 10;
      animation: fadeIn 3s ease-in-out;
    }

    .love-message h1 {
      font-size: 2.5rem;
    }

    .love-message p {
      font-size: 1.2rem;
      margin-top: 0.5rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .hearts::before {
      content: "💖";
      font-size: 30px;
      position: absolute;
      top: 50%;
      left: 50%;
      animation: floatHearts 8s linear infinite;
      z-index: 5;
    }

    @keyframes floatHearts {
      0% {
        transform: translate(-50%, 0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(-100px, -800px) scale(1.5);
        opacity: 0;
      }
    }

    /* Simplified Flower & Grass Mockup (representative only) */
    .flower {
      position: absolute;
      bottom: 0;
      width: 40px;
      height: 100px;
      left: 50%;
      margin-left: -20px;
      animation: grow 3s ease-in-out forwards;
    }

    .flower::before {
      content: "🌸";
      font-size: 3rem;
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
    }

    .flower::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 4px;
      height: 60px;
      background: green;
      transform: translateX(-50%);
    }

    @keyframes grow {
      0% { transform: scaleY(0); opacity: 0; }
      100% { transform: scaleY(1); opacity: 1; }
    }

    .grass {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 80px;
      background: linear-gradient(to top, #44c767, transparent);
      z-index: 1;
    }

    /* Audio Controls (optional to hide) */
    audio {
      display: none;
    }
  </style>
</head>
<body>
  <!-- 💌 Banner -->
  <div class="top-banner">💌 With Love, Forever Yours...</div>

  <!-- 💖 Floating Heart -->
  <div class="hearts"></div>

  <!-- 🌺 Message -->
  <div class="love-message">
    <h1>Happy Girlfriend Day, My Love! 💐</h1>
    <p>You are the flower in the garden of my heart. 🌸</p>
  </div>

  <!-- 🌷 Flowers and Grass -->
  <div class="flowers">
    <div class="flower" style="left: 30%; animation-delay: 1s;"></div>
    <div class="flower" style="left: 50%; animation-delay: 1.5s;"></div>
    <div class="flower" style="left: 70%; animation-delay: 2s;"></div>
    <div class="grass"></div>
  </div>

  <!-- 🎶 Romantic Background Music -->
  <audio autoplay loop>
    <source src="romantic.mp3" type="audio/mpeg" />
    Your browser does not support the audio element.
  </audio>

  <!-- 🌟 JS Fade In -->
  <script>
    window.addEventListener("load", () => {
      document.body.classList.add("loaded");
    });
  </script>
</body>
</html>
